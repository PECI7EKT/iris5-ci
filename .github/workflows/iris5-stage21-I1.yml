name: Iris5 Stage21 - isolated I1 module EROFS audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'audit first; assemble only after audit succeeds'
        required: true
        type: choice
        default: audit
        options:
          - audit
          - assemble

permissions:
  contents: read
  actions: read

concurrency:
  group: iris5-stage21-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-i1:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source and audited Stage20 repacker
        uses: actions/checkout@v4

      - name: Get pinned Stage19 I1 build (run 39125874244)
        uses: actions/download-artifact@v4
        with:
          name: iris5-stage19-build-3
          run-id: 39125874244
          github-token: ${{ github.token }}
          path: stage19

      - name: Get original AK3 source image from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh release download stage20-input -R '${{ github.repository }}' \
            --pattern 'senna-6.6.139-gki+-20261006-2201-ak3.zip' --dir source

      - name: Independently audit I1 binary or assemble EROFS
        env:
          STAGE21_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          bash ci/stage21/run.sh

      - name: Upload Stage21 results (NOT flash approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris5-stage21-I1-${{ inputs.mode }}-${{ github.run_number }}
          path: stage21-output/
          retention-days: 14
          if-no-files-found: warn
