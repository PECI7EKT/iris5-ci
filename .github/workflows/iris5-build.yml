name: Iris5 6.6.139 - preflight / experimental foundation

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "audit = quick offline/remote source check; foundation = heavy experimental kernel build"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - foundation

permissions:
  contents: read

concurrency:
  group: iris5-stage17-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iris5:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout this CI repository
        uses: actions/checkout@v4
      - name: Report runner limits and check stage16 763/763 reference
        run: |
          set -euo pipefail
          python3 ci/verify_reference.py
          df -h .
          free -h
      - name: Verify the three pinned upstream commits without a full checkout
        run: |
          set -euo pipefail
          bash ci/scripts/fetch_sources.sh
      - name: Try kernel foundation build (manual opt-in only)
        if: ${{ inputs.phase == 'foundation' }}
        run: |
          set -euo pipefail
          bash ci/scripts/foundation.sh
      - name: Upload diagnostics even if a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris5-stage17-${{ inputs.phase }}-${{ github.run_number }}
          path: ci-out/
          if-no-files-found: warn
          retention-days: 14
