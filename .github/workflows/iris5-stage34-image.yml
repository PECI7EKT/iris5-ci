name: Iris5 Stage34 EROFS image build
on:
  push:
    paths:
      - '.github/workflows/iris5-stage34-image.yml'
      - 'ci/stage34/repack.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Stage34 module
        uses: actions/download-artifact@v4
        with:
          run-id: 39443387204
          name: iris5-stage34--1
          github-token: ${{ github.token }}
          path: stage34-source
      - name: Fetch developer archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh release download stage20-input -R "${{ github.repository }}" --pattern 'senna-6.6.139-gki+-20261006-2201-ak3.zip' --dir source
      - name: EROFS/SELinux audit
        env:
          STAGE34_IMAGE_MODE: audit
        run: bash ci/stage34/repack.sh
      - name: Assemble candidate
        env:
          STAGE34_IMAGE_MODE: assemble
        run: bash ci/stage34/repack.sh
      - name: Upload audit and candidate image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris5-stage34-image
          path: stage34-image-output/
          if-no-files-found: warn
          retention-days: 14
