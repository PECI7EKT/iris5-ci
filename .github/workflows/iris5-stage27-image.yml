name: Iris5 Stage27 - automatic EROFS audit and image
on:
  push:
    paths:
      - '.github/workflows/iris5-stage27-image.yml'
      - 'ci/stage27/repack.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: iris5-stage27-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve pinned Stage27 compiled module
        uses: actions/download-artifact@v4
        with:
          name: iris5-stage27--2
          run-id: 39226136499
          github-token: ${{ github.token }}
          path: stage27-source
      - name: Retrieve original developer AK3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh release download stage20-input -R "${{ github.repository }}" \
            --pattern 'senna-6.6.139-gki+-20261006-2201-ak3.zip' --dir source
      - name: EROFS verification and metadata/xattr audit
        env:
          STAGE27_IMAGE_MODE: audit
        run: bash ci/stage27/repack.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris5-stage27-image-audit
          path: stage27-image-output/
          if-no-files-found: warn
          retention-days: 14
  assemble:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve pinned Stage27 compiled module
        uses: actions/download-artifact@v4
        with:
          name: iris5-stage27--2
          run-id: 39226136499
          github-token: ${{ github.token }}
          path: stage27-source
      - name: Retrieve original developer AK3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh release download stage20-input -R "${{ github.repository }}" \
            --pattern 'senna-6.6.139-gki+-20261006-2201-ak3.zip' --dir source
      - name: Build Stage27 EROFS with preserved SELinux metadata
        env:
          STAGE27_IMAGE_MODE: assemble
        run: bash ci/stage27/repack.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris5-stage27-image-assemble
          path: stage27-image-output/
          if-no-files-found: warn
          retention-days: 14
