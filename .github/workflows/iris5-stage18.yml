name: Iris5 6.6.139 - stage18 external providers and baseline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight: inspect build#8 output, source and toolchain; baseline: compile 7 providers and original msm_drm.ko"
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - baseline

permissions:
  contents: read
  actions: read

concurrency:
  group: iris5-stage18-${{ github.ref }}
  cancel-in-progress: false

jobs:
  display:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4

      - name: Restore VERIFIED foundation #8 artifact
        uses: actions/download-artifact@v4
        with:
          name: iris5-v2-foundation-8
          run-id: 39088927882
          github-token: ${{ github.token }}
          path: stage18-foundation

      - name: Verify reference, restore foundation and build external providers / display
        env:
          RUN_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 ci/verify_reference.py
          bash ci/scripts/fetch_sources.sh
          bash ci/stage18/run.sh "$RUN_MODE"

      - name: Save diagnostics and verified module only (no flashable images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris5-stage18-${{ inputs.mode }}-${{ github.run_number }}
          path: ci-out/
          if-no-files-found: warn
          retention-days: 14
