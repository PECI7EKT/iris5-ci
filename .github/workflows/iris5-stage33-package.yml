name: Iris5 Stage33 - reversible Stage29 to Stage33 AK3 package (OFFLINE)
on:
  push:
    paths:
      - '.github/workflows/iris5-stage33-package.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified Stage33 EROFS image (pinned run)
        uses: actions/download-artifact@v4
        with:
          run-id: 39427662052
          name: iris5-stage33-image-assemble
          github-token: ${{ github.token }}
          path: stage33-image
      - name: Fetch EXACT installed Stage29 rollback image (pinned run)
        uses: actions/download-artifact@v4
        with:
          run-id: 39328150075
          name: iris5-stage29-image-assemble
          github-token: ${{ github.token }}
          path: stage29-image
      - name: Fetch original developer AK3 template (strict template SHA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh release download stage20-input -R "${{ github.repository }}" \
            --pattern 'senna-6.6.139-gki+-20261006-2201-ak3.zip' --dir source
      - name: Build Stage33 install + exact Stage29 rollback (SHA-locked)
        shell: bash
        run: |
          set -euo pipefail
          i33=$(find stage33-image -type f -name 'STAGE33-OPTIN-DSI-PULSE_VENDOR_DLKM_B_OFFLINE_ONLY.img' | head -1)
          i29=$(find stage29-image -type f -name 'STAGE29-PT-RX-I2C-FIX_VENDOR_DLKM_B_OFFLINE_ONLY.img' | head -1)
          [[ -n "$i33" && -s "$i33" && -n "$i29" && -s "$i29" ]] || { echo 'BLOCKED: missing pinned images'; exit 1; }
          echo '4860d8e8aebed0d97b62db4600a0717e72df7f9a2bec3b94f4fa2ec040b2b991  '"$i33" | sha256sum -c -
          echo 'f844bcd43f28e9cb586dd0a01eb916e6169493ab6198dd64cd31d6a576a78b53  '"$i29" | sha256sum -c -
          python3 release/stage33/make_ak3.py \
            --template 'source/senna-6.6.139-gki+-20261006-2201-ak3.zip' \
            --stage29-image "$i29" --stage33-image "$i33" \
            --outdir stage33-packages
          (cd stage33-packages && sha256sum *.zip > release_zip_sha256.txt)
          unzip -t stage33-packages/Iris5-Stage33-OPTIN-DSI-PULSE-OrangeFox-AK3.zip | tail -1
          unzip -t stage33-packages/Iris5-Stage29-ROLLBACK-from-Stage33-OrangeFox-AK3.zip | tail -1
      - name: Upload both complete OrangeFox ZIPs for offline review
        uses: actions/upload-artifact@v4
        with:
          name: iris5-stage33-installer-plus-exact-stage29-rollback
          path: stage33-packages/
          retention-days: 14
          if-no-files-found: error
