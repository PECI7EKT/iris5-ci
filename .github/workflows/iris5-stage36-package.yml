name: Iris5 Stage36 reversible VBLANK guard OrangeFox package
on:
  push:
    paths:
      - '.github/workflows/iris5-stage36-package.yml'
      - 'release/stage36/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Stage36 verified EROFS image
        uses: actions/download-artifact@v4
        with:
          run-id: 39462925123
          name: iris5-stage36-image
          github-token: ${{ github.token }}
          path: stage36-image
      - name: Fetch exact installed Stage35 image
        uses: actions/download-artifact@v4
        with:
          run-id: 39455539155
          name: iris5-stage35-image
          github-token: ${{ github.token }}
          path: stage35-image
      - name: Fetch pinned developer OrangeFox/AK3 template
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh release download stage20-input -R "${{ github.repository }}" --pattern 'senna-6.6.139-gki+-20261006-2201-ak3.zip' --dir source
      - name: Check pinned SHA and package Stage36 plus exact Stage35 rollback
        run: |
          set -euo pipefail
          image36=$(find stage36-image -type f -name 'STAGE36-VBLANK-GUARD_VENDOR_DLKM_B_OFFLINE_ONLY.img' | head -1)
          image35=$(find stage35-image -type f -name 'STAGE35-RDPTR-TE-DIAG_VENDOR_DLKM_B_OFFLINE_ONLY.img' | head -1)
          [[ -n "$image36" && -s "$image36" && -n "$image35" && -s "$image35" ]] || { echo 'BLOCKED: required pinned EROFS image absent'; exit 1; }
          echo '1e9c2e42358f95f67f57c02eb9cb6aac795e327b51671d2fbbc3e1bacc38bcba  '"$image36" | sha256sum -c -
          echo '1f8583c5418f677fb5ec680cd9c9be3d3c7c76016575c2e667116c7627c2ca58  '"$image35" | sha256sum -c -
          python3 release/stage36/make_ak3.py --template 'source/senna-6.6.139-gki+-20261006-2201-ak3.zip' --stage35-image "$image35" --stage36-image "$image36" --stage36-sha 1e9c2e42358f95f67f57c02eb9cb6aac795e327b51671d2fbbc3e1bacc38bcba --outdir stage36-packages
          (cd stage36-packages && sha256sum *.zip > release_zip_sha256.txt)
          unzip -t stage36-packages/Iris5-Stage36-VBLANK-GUARD-OrangeFox-AK3.zip | tail -1
          unzip -t stage36-packages/Iris5-Stage35-ROLLBACK-from-Stage36-OrangeFox-AK3.zip | tail -1
      - name: Publish complete offline installer and rollback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris5-stage36-install-and-stage35-rollback
          path: stage36-packages/
          if-no-files-found: warn
          retention-days: 14
