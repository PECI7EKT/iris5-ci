name: Iris5 Stage35 reversible RDPTR diagnostic OrangeFox package
on:
  push:
    paths:
      - '.github/workflows/iris5-stage35-package.yml'
      - 'release/stage35/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Stage35 candidate image
        uses: actions/download-artifact@v4
        with:
          run-id: 39455539155
          name: iris5-stage35-image
          github-token: ${{ github.token }}
          path: stage35-image
      - name: Fetch exact Stage34 image for rollback
        uses: actions/download-artifact@v4
        with:
          run-id: 39446812549
          name: iris5-stage34-image
          github-token: ${{ github.token }}
          path: stage34-image
      - name: Fetch pinned AK3 template
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh release download stage20-input -R "${{ github.repository }}" --pattern 'senna-6.6.139-gki+-20261006-2201-ak3.zip' --dir source
      - name: Verify images and assemble install plus rollback
        run: |
          set -euo pipefail
          image34=$(find stage35-image -type f -name 'STAGE35-RDPTR-TE-DIAG_VENDOR_DLKM_B_OFFLINE_ONLY.img' | head -1)
          image33=$(find stage34-image -type f -name 'STAGE34-IRQ-OBSERVE_VENDOR_DLKM_B_OFFLINE_ONLY.img' | head -1)
          test -s "$image34" && test -s "$image33"
          echo '1f8583c5418f677fb5ec680cd9c9be3d3c7c76016575c2e667116c7627c2ca58  '"$image34" | sha256sum -c -
          echo 'a57e5562c4e8a2eef90e2cb69759e10339353afac9657537e98ac7643a01c087  '"$image33" | sha256sum -c -
          python3 release/stage35/make_ak3.py --template 'source/senna-6.6.139-gki+-20261006-2201-ak3.zip' --stage34-image "$image33" --stage35-image "$image34" --stage35-sha 1f8583c5418f677fb5ec680cd9c9be3d3c7c76016575c2e667116c7627c2ca58 --outdir stage35-packages
          (cd stage35-packages && sha256sum *.zip > release_zip_sha256.txt)
          unzip -t stage35-packages/Iris5-Stage35-RDPTR-TE-DIAG-OrangeFox-AK3.zip | tail -1
          unzip -t stage35-packages/Iris5-Stage34-ROLLBACK-from-Stage35-OrangeFox-AK3.zip | tail -1
      - name: Publish install and rollback packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris5-stage35-install-and-rollback
          path: stage35-packages/
          if-no-files-found: warn
          retention-days: 14
