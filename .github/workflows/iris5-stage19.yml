name: Iris5 6.6.139 - Stage19 patch variants ABI audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify: check patch application (no compile); build: compile variants with foundation #8 + Stage18 baseline"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - build

permissions:
  contents: read
  actions: read

concurrency:
  group: iris5-stage19-${{ github.ref }}
  cancel-in-progress: false

jobs:
  variants:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout CI source
        uses: actions/checkout@v4

      - name: Restore pinned Stage17 foundation #8 for target builds only
        if: ${{ inputs.mode == 'build' }}
        uses: actions/download-artifact@v4
        with:
          name: iris5-v2-foundation-8
          run-id: 39088927882
          github-token: ${{ github.token }}
          path: stage18-foundation

      - name: Source audit and patch verification
        run: |
          set -euo pipefail
          python3 ci/verify_reference.py
          bash ci/scripts/fetch_sources.sh
          bash ci/stage19/run.sh verify

      - name: Rebuild pristine baseline and compile isolated variants
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          bash ci/stage18/run.sh baseline
          bash ci/stage19/run.sh build

      - name: Upload diagnostics and offline-only modules (never flashable packages)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris5-stage19-${{ inputs.mode }}-${{ github.run_number }}
          path: ci-out/
          if-no-files-found: warn
          retention-days: 14
