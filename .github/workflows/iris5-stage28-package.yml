name: Iris5 Stage28 - AK3 vendor_dlkm_b-only packages and rollback
on:
  push:
    paths:
      - '.github/workflows/iris5-stage28-package.yml'
      - 'ci/stage28/make_ak3.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned audited Stage28 image
        uses: actions/download-artifact@v4
        with:
          run-id: 39291187351
          name: iris5-stage28-image-assemble
          github-token: ${{ github.token }}
          path: stage28-image
      - name: Fetch pinned installed Stage27 rollback image
        uses: actions/download-artifact@v4
        with:
          run-id: 39227353474
          name: iris5-stage27-image-assemble
          github-token: ${{ github.token }}
          path: stage27-image
      - name: Fetch pinned original developer AK3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh release download stage20-input -R "${{ github.repository }}" \
            --pattern 'senna-6.6.139-gki+-20261006-2201-ak3.zip' --dir source
      - name: Repack strictly vendor_dlkm_b-only and verify both ZIPs
        shell: bash
        run: |
          set -euo pipefail
          i28=$(find stage28-image -type f -name 'STAGE28-PT-ERRORLOCK-FIX_VENDOR_DLKM_B_OFFLINE_ONLY.img' | head -1)
          i27=$(find stage27-image -type f -name 'STAGE27-I1-SSC-PT-ESD-I2C-DSI-GPIO_VENDOR_DLKM_B_OFFLINE_ONLY.img' | head -1)
          test -n "$i28" && test -s "$i28"
          test -n "$i27" && test -s "$i27"
          python3 ci/stage28/make_ak3.py \
            --template 'source/senna-6.6.139-gki+-20261006-2201-ak3.zip' \
            --stage27-image "$i27" --stage28-image "$i28" \
            --outdir stage28-packages
          (cd stage28-packages && sha256sum *.zip > release_zip_sha256.txt)
          unzip -t stage28-packages/Iris5-Stage28-PT-Fix-vendor_dlkm_b-OrangeFox-AK3.zip | tail -1
          unzip -t stage28-packages/Iris5-Stage27-ROLLBACK-from-Stage28-OrangeFox-AK3.zip | tail -1
      - name: Upload two complete OrangeFox AK3 release ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: iris5-stage28-AK3-installer-and-stage27-rollback
          path: stage28-packages/
          retention-days: 14
          if-no-files-found: error
