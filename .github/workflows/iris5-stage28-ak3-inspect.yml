name: Iris5 Stage28 - inspect AK3 developer template (OFFLINE)
on:
  push:
    paths:
      - '.github/workflows/iris5-stage28-ak3-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned developer package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh release download stage20-input -R "${{ github.repository }}" \
            --pattern 'senna-6.6.139-gki+-20261006-2201-ak3.zip' --dir source
          sha256sum source/*.zip
      - name: Inspect AK3 layout and installers, read-only
        run: |
          python3 - <<'PY'
          import zipfile
          p="source/senna-6.6.139-gki+-20261006-2201-ak3.zip"
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              print("ENTRIES",len(names))
              print("ROOT", [x for x in names if "/" not in x][:50])
              print("SCRIPT_NAMES",[x for x in names if any(s in x.lower() for s in ('anykernel','updater','update-binary','flash','install','ak3-core','tool-functions'))][:90])
              for name in ('anykernel.sh','META-INF/com/google/android/update-binary',
                           'META-INF/com/google/android/updater-script','tools/ak3-core.sh'):
                  if name in names:
                      b=z.read(name)
                      print("FILE",name,"bytes",len(b))
                      print(b[:10000].decode(errors="replace"))
          PY
